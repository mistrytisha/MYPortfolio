<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      
      .bg { fill: #f3f1e9; }
      .line { stroke: #dfdcd2; stroke-width: 1.5; }
      .logo-main { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; fill: #1f2522; }
      .logo-sub { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; fill: #5A5D57; letter-spacing: 2.5px; }
      .nav { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: #484a46; letter-spacing: 1.5px; }
      .label { font-family: 'Inter', sans-serif; font-size: 11px; fill: #b35142; letter-spacing: 2px; font-weight: 600; }
      .title { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 600; fill: #1f2522; }
      .body-text { font-family: 'Inter', sans-serif; font-size: 16px; fill: #4a4c4a; }
      .green-outline { fill: none; stroke: #4f6355; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="650" class="bg"/>

  <!-- Header Line -->
  <line x1="0" y1="70" x2="1200" y2="70" class="line"/>

  <!-- Header Text -->
  <text x="50" y="45">
    <tspan class="logo-main">Finca</tspan>
    <tspan class="logo-sub" dx="8" dy="-2">RESTRO CAFE</tspan>
  </text>

  <!-- Nav -->
  <text x="680" y="42" class="nav">ABOUT</text>
  <text x="760" y="42" class="nav">MENU</text>
  <text x="835" y="42" class="nav">GALLERY</text>
  <text x="935" y="42" class="nav">CELEBRATIONS</text>
  <text x="1080" y="42" class="nav">VISIT</text>

  <!-- Main Content Left -->
  <text x="50" y="190" class="label">THE PLACE</text>
  <text x="50" y="245" class="title">Dining, grown outdoors.</text>
  
  <!-- Paragraph 1 -->
  <text x="50" y="300" class="body-text">Finca sits behind a brick archway in Sevasi, opening into a garden</text>
  <text x="50" y="332" class="body-text">dining room strung with fairy lights and shaded by real trees. It's the</text>
  <text x="50" y="364" class="body-text">kind of place that works equally well for a quiet coffee, a long dinner,</text>
  <text x="50" y="396" class="body-text">or a table full of people celebrating something.</text>

  <!-- Paragraph 2 -->
  <text x="50" y="460" class="body-text">The menu leans comforting and a little global — wood-fired pizzas,</text>
  <text x="50" y="492" class="body-text">sizzlers, fresh mocktails, and shakes worth saving room for — served</text>
  <text x="50" y="524" class="body-text">at a pace that doesn't rush the evening.</text>

  <!-- Offset Green Outline -->
  <rect x="720" y="105" width="460" height="490" class="green-outline"/>
  
  <!-- Embedded Image -->
  <image href="static.jpg" x="740" y="125" width="460" height="525" preserveAspectRatio="xMidYMid slice" />
</svg>
